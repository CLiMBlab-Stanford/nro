markup: main
gradient_unwarping: auto
fsaverage_template: fsaverage6
container:
  image: site:qunex
  engine: site:runtime
  cleanenv: true
  bind: site:binds
  home: null
  inner_setup: >-
    set +e; source /opt/qunex/env/qunex_environment.sh >/dev/null 2>&1;
    qx_setup_rc=$?; set -e; if [ "$qx_setup_rc" -ne 0 ]; then
    echo "QuNex environment setup failed with status $qx_setup_rc" >&2;
    exit "$qx_setup_rc"; fi
  no_container: false
selection_strategy: first
surface_reconstruction_engine: freesurfer
mni_template: site:mni_template
synthstrip_container: site:synthstrip
freesurfer_container: site:freesurfer
fastsurfer_container: site:fastsurfer
lesion:
  masker_command: null
  fastsurfer_image: site:fastsurfer
  use_gpu: true
msmall:
  enabled: true
  high_resolution_mesh: 164
  low_resolution_mesh: 32
  grayordinates_resolution_mm: 2
  functional_resolution_mm: 2
  surface_smoothing_fwhm_mm: 2
  input_registration: MSMSulc
  output_registration: MSMAll
  iteration_modes: CA_CAT
  method: WRN
  ica_dimension: 40
  high_pass_seconds: 0
  fix_threshold: 10
  fix_training_model: HCP_Style_Single_Multirun_Dedrift
  matlab_run_mode: octave
freesurfer_subjects_dir: null
fs_subject: null
overwrite: false
verbose: false
