markup: main
min_trs: 50
gm_mask_threshold: 0.2
confounds_regex: '^(global_signal|csf|white_matter|trans_[xyz]|rot_[xyz])(?:_derivative1)?(?:_power2)?$'
nuisance_variance_explained: 0.99
minimum_temporal_rank: 30
minimum_temporal_rank_fraction: 0.5
temporal_mask_regex: '.*outlier.*'
standardize: true
detrend: true
regress_out_task: true
low_pass: 0.1
high_pass: 0.01
overwrite: false
verbose: false
container:
  image: site:qunex
  engine: site:runtime
  cleanenv: true
  bind: site:binds
  home: null
  inner_setup: >-
    set +e; source /opt/qunex/env/qunex_environment.sh >/dev/null 2>&1;
    qx_setup_rc=$?; set -e; if [ "$qx_setup_rc" -ne 0 ]; then
    echo "QuNex environment setup failed with status $qx_setup_rc" >&2;
    exit "$qx_setup_rc"; fi
  no_container: false
wb_command: wb_command
